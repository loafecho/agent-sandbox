#!/usr/sbin/nft -f
# switchboard VM firewall (v0.4, 2026-10-20). No SSH: admin goes through the Proxmox host's guest agent.
# In:  agent-host (172.16.0.32) -> 8800 (MCP). On the tailnet: 443 (tailscale serve -> the passkey page on 127.0.0.1:8801)
#      from the approver's phone 198.51.100.24 (the tailnet ACL also lets the admin workstation reach it: see NOTE).
#      WireGuard udp 41641. Nothing else; 8801 is reachable from lo only. NOTE: tailscale serve answers 443 inside
#      tailscaled (netstack), so the tailscale0 443 rule below is defence in depth only; the page's own device check
#      (X-Forwarded-For == the phone, guards::web_device) is what keeps other tailnet devices off it.
# Out: the switchboard user (skuid switchboard): Prometheus, the Proxmox API, Jellyfin, HTTPS to discord.com's
#      IPv4s (set discord4, filled by switchboard-discord-ips.timer), ntfy's tailnet address 198.51.100.96:443, and the
#      upstream MCP gateways at the tailnet address 198.51.100.25:8790-8792. 443 to anything else stays closed to it.
#      root (skuid 0, i.e. tailscaled): tcp 80/443 (control plane, DERP, the serve certificate) and its WireGuard/STUN UDP.
#      DNS for everyone (to the LAN resolver only); NTP only for systemd-timesync (round 2: no UDP 123 channel for
#      the switchboard user).
# tailscaled runs with --netfilter-mode=off, so it adds no rules of its own and this flush removes nothing of its.
flush ruleset

table inet switchboard {
  set discord4 {
    type ipv4_addr
  }
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr 172.16.0.32 tcp dport 8800 accept
    iifname "tailscale0" ip saddr 198.51.100.24 tcp dport 443 accept
    udp dport 41641 accept
    tcp dport 8800 reject with tcp reset
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    meta skuid "switchboard" ip daddr 172.16.0.29 tcp dport 9090 accept
    meta skuid "switchboard" ip daddr 172.16.0.88 tcp dport 8006 accept
    meta skuid "switchboard" ip daddr 172.16.0.91 tcp dport 8096 accept
    meta skuid "switchboard" ip daddr @discord4 tcp dport 443 accept
    meta skuid "switchboard" oifname "tailscale0" ip daddr 198.51.100.96 tcp dport 443 accept
    meta skuid "switchboard" oifname "tailscale0" ip daddr 198.51.100.25 tcp dport 8790-8792 accept
    meta skuid 0 tcp dport { 80, 443 } accept
    meta skuid 0 udp sport 41641 accept
    meta skuid 0 udp dport 3478 accept
    ip daddr 172.16.0.53 udp dport 53 accept
    ip daddr 172.16.0.53 tcp dport 53 accept
    meta skuid "systemd-timesync" udp dport 123 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
